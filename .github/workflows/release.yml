name: Release do aplicativo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Criar versão e tag do release
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $version = node -p "require('./package.json').version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$version [skip ci]"
          git tag "v$version"
          git push origin "HEAD:${{ github.ref_name }}" --follow-tags
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Aguardar propagação da tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:APP_VERSION"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tagUrl = "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/$tag"
          $tagFound = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $tagInfo = Invoke-RestMethod -Uri $tagUrl -Headers $headers -Method Get
              if ($tagInfo.ref -eq "refs/tags/$tag") {
                $tagFound = $true
                break
              }
            } catch {
              # A API pode levar alguns segundos para propagar a tag recém-enviada.
            }
            Start-Sleep -Seconds 5
          }
          if (-not $tagFound) {
            throw "A tag $tag não ficou disponível na API do GitHub dentro do tempo esperado."
          }
          Start-Sleep -Seconds 10

      - name: Gerar e publicar instalador e versão portátil
        run: pnpm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
