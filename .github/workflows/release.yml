name: Release do aplicativo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Ativar pnpm
        shell: pwsh
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Criar versão e tag do release
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $version = node -p "require('./package.json').version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$version [skip ci]"
          git tag "v$version"
          git push origin "HEAD:${{ github.ref_name }}" --follow-tags
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Gerar e publicar instalador e versão portátil
        run: pnpm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
